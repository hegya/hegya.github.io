<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>当前位置信息</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
		body { max-width: 600px; margin: 20px auto; padding: 0 15px; line-height: 1.6; }
		.container { padding: 20px; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9; }
		.item { margin: 10px 0; padding: 8px; background: #fff; border-radius: 4px; }
		.loading { color: #666; text-align: center; padding: 20px; }
		.error { color: #dc3545; padding: 10px; background: #f8d7da; border-radius: 4px; }
		strong { color: #212529; }
	</style>
</head>
<body>
	<div class="container">
		<div id="content" class="loading">正在获取位置信息...</div>
	</div>

	<script>
		// 格式化当前时间（YYYY-MM-DD HH:mm:ss）
		function formatDateTime() {
			const now = new Date();
			return now.toLocaleString('zh-CN', { 
				year: 'numeric', month: '2-digit', day: '2-digit',
				hour: '2-digit', minute: '2-digit', second: '2-digit',
				hour12: false 
			}).replace(/\//g, '-');
		}

		// 方案1：浏览器原生反向地理编码（无依赖，优先尝试）
		async function getAddressByBrowser(lat, lng) {
			try {
				// 仅部分现代浏览器（Chrome/Edge/火狐）支持
				const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=zh-CN`);
				const data = await res.json();
				return data.display_name || "地址解析成功（无详细信息）";
			} catch (e) {
				return null; // 失败则返回null，降级到方案2
			}
		}

		// 方案2：OpenStreetMap开源API（兜底，无需Key）
		async function getAddressByOSM(lat, lng) {
			try {
				const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=zh-CN&user-agent=GitHubPages-Location/1.0`);
				const data = await res.json();
				return data.display_name ? data.display_name : "仅获取到坐标，地址解析失败";
			} catch (e) {
				return "仅获取到坐标，地址解析失败";
			}
		}

		// 主逻辑：先试原生，失败则用OSM
		async function getAddress(lat, lng) {
			const browserAddr = await getAddressByBrowser(lat, lng);
			return browserAddr || await getAddressByOSM(lat, lng);
		}

		// 展示位置信息（纯浏览器原生坐标，无任何转换）
		async function showLocation(pos) {
			const { latitude, longitude, altitude } = pos.coords;
			const lat = latitude.toFixed(6);
			const lng = longitude.toFixed(6);
			const alt = altitude ? altitude.toFixed(2) + ' 米' : '无法获取';
			const datetime = formatDateTime();
			const address = await getAddress(latitude, longitude);

			document.getElementById('content').innerHTML = `
				<div class="item"><strong>纬度：</strong>${lat}</div>
				<div class="item"><strong>经度：</strong>${lng}</div>
				<div class="item"><strong>海拔：</strong>${alt}</div>
				<div class="item"><strong>地址：</strong>${address}</div>
				<div class="item"><strong>当前时间：</strong>${datetime}</div>
			`;
		}

		// 定位错误处理
		function showError(err) {
			const errMsg = {
				1: "用户拒绝了位置授权",
				2: "位置信息不可用",
				3: "定位超时"
			}[err.code] || "定位失败：" + err.message;
			document.getElementById('content').innerHTML = `<div class="error">${errMsg}</div>`;
		}

		// 初始化（仅用浏览器原生Geolocation API）
		if (navigator.geolocation) {
			navigator.geolocation.getCurrentPosition(
				showLocation,
				showError,
				{ enableHighAccuracy: true, timeout: 10000 }
			);
		} else {
			document.getElementById('content').innerHTML = '<div class="error">浏览器不支持定位功能</div>';
		}
	</script>
</body>
</html>
