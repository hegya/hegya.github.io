<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>当前位置信息</title>
	<!-- 引入腾讯地图前端JS API（支持跨域） -->
	<script src="https://map.qq.com/api/js?v=2.exp&key=AOBZ-R2S3J-PAWFO-KXURI-IB4AF-4PBG5"></script>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { margin: 10px auto; padding: 0 8px; line-height: 1.6; }
		.container { padding: 10px; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9; }
		.item { margin: 5px 0; padding: 4px; background: #fff; border-radius: 4px; }
		.loading { color: #666; text-align: center; padding: 10px; }
		.error { color: #dc3545; padding: 5px; background: #f8d7da; border-radius: 4px; }
		strong { color: #212529; }
	</style>
</head>
<body>
	<div class="container">
		<div id="content" class="loading">正在获取位置信息...</div>
	</div>

	<script>
		// 格式化当前日期时间（YYYY-MM-DD HH:mm:ss）
		function formatDateTime() {
			const now = new Date();
			return now.toLocaleString('zh-CN', { 
				year: 'numeric', month: '2-digit', day: '2-digit',
				hour: '2-digit', minute: '2-digit', second: '2-digit',
				hour12: false 
			}).replace(/\//g, '-');
		}

		// 逆地址解析（用腾讯前端JS API，支持跨域）
		function getAddress(lat, lng, callback) {
			const geocoder = new qq.maps.Geocoder({
				complete: res => {
					callback(null, res.detail.address);
				},
				error: () => {
					callback(new Error("地址解析失败"));
				}
			});
			geocoder.getAddress(new qq.maps.LatLng(lat, lng));
		}

		// 展示位置信息
		function showLocation(pos) {
			const { latitude, longitude, altitude } = pos.coords;
			const lat = latitude.toFixed(6);
			const lng = longitude.toFixed(6);
			const alt = altitude ? altitude.toFixed(2) + ' 米' : '无法获取';
			const datetime = formatDateTime();

			getAddress(lat, lng, (err, address) => {
				document.getElementById('content').innerHTML = `
					<div class="item"><strong>纬度：</strong>${lat}</div>
					<div class="item"><strong>经度：</strong>${lng}</div>
					<div class="item"><strong>海拔：</strong>${alt}</div>
					<div class="item"><strong>地址：</strong>${err ? err.message : address}</div>
					<div class="item"><strong>当前时间：</strong>${datetime}</div>
				`;
			});
		}

		// 处理定位错误
		function showError(err) {
			const errMsg = {
				1: "用户拒绝了位置授权",
				2: "位置信息不可用",
				3: "定位超时"
			}[err.code] || "定位失败：" + err.message;
			document.getElementById('content').innerHTML = `<div class="error">${errMsg}</div>`;
		}

		// 初始化定位
		if (navigator.geolocation) {
			navigator.geolocation.getCurrentPosition(
				showLocation,
				showError,
				{ enableHighAccuracy: true, timeout: 10000 }
			);
		} else {
			document.getElementById('content').innerHTML = '<div class="error">浏览器不支持定位功能</div>';
		}
	</script>
</body>
</html>
