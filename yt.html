<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>YouTube 音频提取</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
		h1 { color: #333; margin-bottom: 1.5rem; }
		#urlInput { 
			width: 100%; 
			padding: 0.8rem; 
			border: 1px solid #ddd; 
			border-radius: 4px; 
			margin-bottom: 1rem; 
			font-size: 1rem; 
		}
		#submitBtn { 
			background: #0071e3; 
			color: white; 
			border: none; 
			padding: 0.8rem 2rem; 
			border-radius: 4px; 
			cursor: pointer; 
			font-size: 1rem; 
		}
		#submitBtn:disabled { background: #999; cursor: not-allowed; }
		#result { 
			margin-top: 1.5rem; 
			padding: 1rem; 
			border-radius: 4px; 
			display: none; 
		}
		.success { background: #f0f9ff; border: 1px solid #bae6fd; color: #0369a1; }
		.error { background: #fef2f2; border: 1px solid #fecdd3; color: #b91c1c; }
		.loading { color: #666; }
		.audio-item { 
			margin: 0.8rem 0; 
			padding: 0.6rem; 
			background: #ffffff; 
			border-radius: 3px; 
			box-shadow: 0 1px 2px rgba(0,0,0,0.1);
		}
		.audio-item a { 
			color: #0071e3; 
			text-decoration: none; 
			word-break: break-all; 
			display: inline-block;
			margin-top: 0.3rem;
		}
		.audio-item a:hover { text-decoration: underline; }
		.audio-item .no-link { color: #999; }
		.video-id { margin-bottom: 1rem; font-weight: 500; }
		.format-info { color: #666; font-size: 0.9rem; margin: 0.3rem 0; }
	</style>
</head>
<body>
	<h1>YouTube 音频提取</h1>
	<input type="text" id="urlInput" placeholder="输入 YouTube 链接">
	<button id="submitBtn" onclick="extractAudio()">提取音频</button>
	<div id="result"></div>

	<script>
		// 替换为你的 Cloudflare Worker 域名
		const WORKER_API_URL = 'https://yt-api.mobike.workers.dev/api/extract-audio';

		async function extractAudio() {
			const urlInput = document.getElementById('urlInput');
			const submitBtn = document.getElementById('submitBtn');
			const result = document.getElementById('result');
			const youtubeUrl = urlInput.value.trim();

			// 校验输入
			if (!youtubeUrl) {
				showResult('请输入 YouTube 链接', 'error');
				return;
			}

			// 加载状态
			submitBtn.disabled = true;
			showResult('正在提取音频，请稍候...', 'loading');

			try {
				// 调用 Worker API
				const response = await fetch(WORKER_API_URL, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ url: youtubeUrl }),
				});

				const data = await response.json();

				if (data.success) {
					// 构造音频列表 HTML
					let audioHtml = `<div class="video-id">视频ID：${data.videoId}</div>`;
					data.audioList.forEach(item => {
						// 处理 mimeType：优先取核心格式（如 audio/webm → webm），无则显示“未知格式”
						const fileFormat = item.mimeType 
							? item.mimeType.split(';')[0].split('/')[1].toUpperCase() 
							: '未知格式';
						
						audioHtml += `
							<div class="audio-item">
								<div>${item.name} (itag=${item.itag})</div>
								<div class="format-info">文件格式：${fileFormat}</div>
								${item.url 
									? `<a href="${item.url}" target="_blank" download>点击下载</a>` 
									: '<span class="no-link">暂无该格式音频</span>'}
							</div>
						`;
					});
					showResult(audioHtml, 'success');
				} else {
					showResult(data.error || '提取失败，未知错误', 'error');
				}
			} catch (error) {
				showResult(`请求失败：${error.message}`, 'error');
			} finally {
				submitBtn.disabled = false;
			}
		}

		// 显示结果
		function showResult(html, type) {
			const result = document.getElementById('result');
			result.style.display = 'block';
			result.className = type;
			result.innerHTML = html;
		}
	</script>
</body>
</html>
